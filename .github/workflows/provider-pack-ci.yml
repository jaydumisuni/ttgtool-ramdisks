name: Provider Pack CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, catalog/provider-pack-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Run inventory tests
        run: python -m unittest discover -s tests -v
      - name: Validate schema document
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          schema = json.loads(Path('schemas/provider-pack-v1.schema.json').read_text(encoding='utf-8'))
          validator_for(schema).check_schema(schema)
          print('Provider-pack schema is valid.')
          PY
      - name: Enforce no package binaries
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = {'.zip', '.7z', '.rar', '.img4', '.dmg', '.ipsw', '.bin', '.exe'}
          bad = [str(p) for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in forbidden]
          if bad:
              raise SystemExit('Forbidden package artifacts committed: ' + ', '.join(sorted(bad)))
          print('No ramdisk or executable artifacts are committed.')
          PY
